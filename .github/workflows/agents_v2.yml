name: agents_v2
on:
  schedule:
    - cron: "5 * * * *"   # every hour
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agents_v2
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy requests
      - run: python agents_v2.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT }}
      - name: Save report card
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add state.json
          git commit -m "update report card" || exit 0
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          echo "Could not save the report card this hour, will try next hour"
